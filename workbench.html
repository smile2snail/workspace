<div id="root"></div>
<script type="text/plain" id="app-source">

const { useState, useEffect, useCallback } = React;

const COLORS = {
  paper: "#E9E4D4", paperDeep: "#DCD5BF", ink: "#2B2A28", inkSoft: "#5C574C",
  coaching: "#3F6259", coachingSoft: "#DCE7E2",
  content: "#B07E2C", contentSoft: "#F0E3C8",
  daily: "#A15242", dailySoft: "#F1DCD5",
  progress: "#3B5674", progressSoft: "#DCE3EC",
  line: "#C9C1AA",
};

const Icon = ({ children, size = 16, color = "currentColor", spin: doSpin }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
       strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
       className={doSpin ? "spin" : ""}>{children}</svg>
);
const IconNotebook = (p) => <Icon {...p}><path d="M4 4h13a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V6a2 2 0 0 1 2-2z"/><path d="M14 8l4-4"/></Icon>;
const IconSparkles = (p) => <Icon {...p}><path d="M12 3l1.6 4.4L18 9l-4.4 1.6L12 15l-1.6-4.4L6 9l4.4-1.6z"/><path d="M19 15l.7 2 2 .7-2 .7-.7 2-.7-2-2-.7 2-.7z"/></Icon>;
const IconInbox = (p) => <Icon {...p}><path d="M3 12h4l2 3h6l2-3h4"/><path d="M5 12l1-7h12l1 7"/><path d="M5 12v6h14v-6"/></Icon>;
const IconListChecks = (p) => <Icon {...p}><path d="M4 6l1.5 1.5L8 5"/><path d="M4 12l1.5 1.5L8 11"/><path d="M4 18l1.5 1.5L8 17"/><path d="M12 6h8"/><path d="M12 12h8"/><path d="M12 18h8"/></Icon>;
const IconWand = (p) => <Icon {...p}><path d="M4 20L18 6"/><path d="M15 3l1 2 2 1-2 1-1 2-1-2-2-1 2-1z"/><path d="M4 4l.7 1.3L6 6l-1.3.7L4 8l-.7-1.3L2 6l1.3-.7z"/></Icon>;
const IconPlus = (p) => <Icon {...p}><path d="M12 5v14M5 12h14"/></Icon>;
const IconTrash = (p) => <Icon {...p}><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></Icon>;
const IconLoader = (p) => <Icon {...p} spin><path d="M12 3a9 9 0 1 0 9 9"/></Icon>;
const IconGear = (p) => <Icon {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c0 .7.4 1.3 1 1.5h.1a2 2 0 1 1 0 4h-.1c-.7 0-1.3.4-1.6 1z"/></Icon>;

const TABS = [
  { key: "coaching", label: "教练日志", icon: IconNotebook, color: COLORS.coaching },
  { key: "content", label: "创作火花", icon: IconSparkles, color: COLORS.content },
  { key: "box", label: "待办事项", icon: IconListChecks, color: COLORS.daily },
  { key: "guide", label: "潘多拉魔盒", icon: IconInbox, color: COLORS.progress },
];

const STORAGE_KEY = "workbench-data";
const API_KEY_STORAGE = "workbench-api-key";
const ACC_CUTOFF = "2026-07-10";
const CONTENT_TAGS = ["自媒体", "播客", "其他"];

const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDate = (iso) => {
  try { return new Date(iso + "T00:00:00").toLocaleDateString("zh-CN", { month: "2-digit", day: "2-digit", weekday: "short" }); }
  catch { return iso; }
};
const fmtTime = (ts) => {
  try { return new Date(ts).toLocaleString("zh-CN", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" }); }
  catch { return ""; }
};

async function callClaude(system, user, apiKey, maxTokens) {
  if (!apiKey) throw new Error("请先在右上角设置里填入你的 Anthropic API Key");
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: maxTokens || 1200, system, messages: [{ role: "user", content: user }] }),
  });
  if (!res.ok) { const t = await res.text().catch(() => ""); throw new Error("API 请求失败：" + res.status + " " + t.slice(0, 200)); }
  const data = await res.json();
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n").trim();
  if (!text) throw new Error("没有收到有效回复");
  return text;
}

const emptyData = () => ({ sessions: [], ideas: [], todoEntries: [], pandoraEntries: [], coachingOverview: null, boxReflection: null });

function migrate(d) {
  const next = Object.assign(emptyData(), d);
  if (Array.isArray(d.boxEntries) && !Array.isArray(d.todoEntries)) next.todoEntries = d.boxEntries;
  if (!Array.isArray(next.todoEntries)) next.todoEntries = [];
  if (!Array.isArray(next.pandoraEntries)) next.pandoraEntries = [];
  if (Array.isArray(d.dailyLogs) && d.dailyLogs.length && !next.todoEntries.length) {
    next.todoEntries = d.dailyLogs.map(l => ({ id: l.id || uid(), text: l.note || l.nextStep || "", createdAt: l.createdAt || Date.now() }));
  }
  next.todoEntries = next.todoEntries.map(e => Object.assign({ text: "", createdAt: Date.now(), done: false }, e));
  next.pandoraEntries = next.pandoraEntries.map(e => Object.assign({ text: "", createdAt: Date.now() }, e));
  next.sessions = (next.sessions || []).map(s => {
    const transcript = s.transcript !== undefined ? s.transcript : (s.notes || "");
    return Object.assign({ hours: 1, paymentType: "paid", clientSummary: "" }, s, { transcript });
  });
  next.ideas = (next.ideas || []).map(i => {
    if (i.title !== undefined) return Object.assign({ appendix: "", content: "" }, i, { tag: i.tag === "脑洞" ? "播客" : i.tag });
    return { id: i.id, tag: i.tag === "脑洞" ? "播客" : (i.tag || "其他"), title: i.text || "", content: "", appendix: "", createdAt: i.createdAt || Date.now() };
  });
  return next;
}

function loadData() {
  try { const raw = localStorage.getItem(STORAGE_KEY); return migrate(raw ? JSON.parse(raw) : {}); }
  catch { return emptyData(); }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

function SectionLabel({ children, color }) {
  return <div className="wb-mono text-xs tracking-widest uppercase mb-3" style={{ color, letterSpacing: "0.12em" }}>{children}</div>;
}
function PrimaryButton({ onClick, disabled, children, color, icon: Ico }) {
  return (
    <button onClick={onClick} disabled={disabled}
      className="wb-body inline-flex items-center gap-2 px-4 py-2 rounded-sm text-sm font-medium disabled:opacity-50"
      style={{ backgroundColor: color, color: COLORS.paper }}>
      {disabled ? <IconLoader size={15} /> : Ico ? <Ico size={15} /> : null}
      {children}
    </button>
  );
}
function EmptyState({ text }) {
  return <div className="wb-body text-sm py-8 text-center rounded-sm border border-dashed" style={{ color: COLORS.inkSoft, borderColor: COLORS.line }}>{text}</div>;
}
function PillButton({ active, onClick, children, color, soft }) {
  return (
    <button onClick={onClick} className="wb-mono text-xs px-2.5 py-1 rounded-full border"
      style={{ borderColor: active ? color : COLORS.line, backgroundColor: active ? soft : "transparent", color: active ? color : COLORS.inkSoft }}>
      {children}
    </button>
  );
}

function CoachingTab({ data, mutate, apiKey }) {
  const [client, setClient] = useState(""); const [date, setDate] = useState(todayISO());
  const [hours, setHours] = useState("1"); const [paymentType, setPaymentType] = useState("paid");
  const [transcript, setTranscript] = useState(""); const [clientSummary, setClientSummary] = useState("");
  const [busyId, setBusyId] = useState(null); const [busyOverview, setBusyOverview] = useState(false);
  const [error, setError] = useState(""); const [expanded, setExpanded] = useState({});
  const [editingId, setEditingId] = useState(null); const [editDraft, setEditDraft] = useState(null);
  const [filter, setFilter] = useState("全部");

  const addSession = () => {
    if (!transcript.trim()) return;
    const entry = { id: uid(), client: client.trim() || "未命名来访者", date, hours: parseFloat(hours) || 0, paymentType, transcript: transcript.trim(), clientSummary: clientSummary.trim(), summary: null, createdAt: Date.now() };
    mutate(d => ({ ...d, sessions: [entry, ...d.sessions] }));
    setClient(""); setTranscript(""); setClientSummary(""); setDate(todayISO()); setHours("1"); setPaymentType("paid");
  };
  const summarize = async (session) => {
    setError(""); setBusyId(session.id);
    try {
      const summary = await callClaude(
        "你是一位经验丰富的教练督导，帮助教练复盘单次会谈。请始终用中文回复，语气直接、具体、有建设性。",
        `以下是一次教练对话的记录或笔记（来访者：${session.client}，日期：${session.date}）：\n\n${session.transcript}\n\n请按结构给出简短复盘：\n1. 做得好的地方\n2. 可提升的地方\n3. 来访者的核心议题与可能的反馈/收获`,
        apiKey
      );
      mutate(d => ({ ...d, sessions: d.sessions.map(s => s.id === session.id ? { ...s, summary } : s) }));
      setExpanded(e => ({ ...e, [session.id]: true }));
    } catch (e) { setError(e.message); } finally { setBusyId(null); }
  };
  const generateOverview = async () => {
    setError(""); setBusyOverview(true);
    try {
      const list = [...data.sessions].reverse().map(s => `- ${s.date} ${s.client}：${s.summary || s.transcript}`).join("\n") || "（暂无记录）";
      const result = await callClaude(
        "你是一位教练成长顾问，帮助教练回顾一段时间以来所有的会谈记录，梳理成长脉络。请始终用中文回复，具体、有洞察力。",
        `以下是我目前所有的教练会谈记录（按时间顺序）：\n\n${list}\n\n请帮我梳理：\n1. 整体上我在哪些方面明显进步了\n2. 我比较擅长的技能/风格是什么\n3. 我还需要继续提升的地方是什么`,
        apiKey, 1500
      );
      mutate(d => ({ ...d, coachingOverview: { text: result, generatedAt: Date.now() } }));
    } catch (e) { setError(e.message); } finally { setBusyOverview(false); }
  };
  const remove = (id) => mutate(d => ({ ...d, sessions: d.sessions.filter(s => s.id !== id) }));
  const startEdit = (s) => { setEditingId(s.id); setEditDraft({ ...s }); };
  const saveEdit = () => {
    mutate(d => ({ ...d, sessions: d.sessions.map(s => s.id === editDraft.id ? { ...editDraft, hours: parseFloat(editDraft.hours) || 0 } : s) }));
    setEditingId(null); setEditDraft(null);
  };

  const countedSessions = data.sessions.filter(s => s.date >= ACC_CUTOFF);
  const totalHours = countedSessions.reduce((sum, s) => sum + (s.hours || 0), 0);
  const paidHours = countedSessions.filter(s => s.paymentType === "paid").reduce((sum, s) => sum + (s.hours || 0), 0);
  const proBonoHours = countedSessions.filter(s => s.paymentType === "pro_bono").reduce((sum, s) => sum + (s.hours || 0), 0);
  const countedProBono = Math.min(proBonoHours, 25);
  const countableTotal = paidHours + countedProBono;
  const hoursToGo = Math.max(0, 100 - countableTotal);
  const paidGap = Math.max(0, 75 - paidHours);
  const filteredSessions = data.sessions.filter(s => filter === "全部" ? true : filter === "付费" ? s.paymentType === "paid" : s.paymentType === "pro_bono");

  return (
    <div>
      <SectionLabel color={COLORS.coaching}>记一次新的会谈</SectionLabel>
      <div className="space-y-2 mb-6">
        <div className="flex gap-2">
          <input value={client} onChange={e => setClient(e.target.value)} placeholder="来访者（可留空）"
            className="wb-body flex-1 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
          <input type="date" value={date} onChange={e => setDate(e.target.value)}
            className="wb-mono px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
        </div>
        <div className="flex gap-2 items-center flex-wrap">
          <input type="number" step="0.5" min="0" value={hours} onChange={e => setHours(e.target.value)}
            className="wb-mono w-24 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
          <span className="wb-mono text-xs" style={{ color: COLORS.inkSoft }}>小时</span>
          <div className="flex-1" />
          <PillButton active={paymentType === "paid"} onClick={() => setPaymentType("paid")} color={COLORS.coaching} soft={COLORS.coachingSoft}>付费</PillButton>
          <PillButton active={paymentType === "pro_bono"} onClick={() => setPaymentType("pro_bono")} color={COLORS.coaching} soft={COLORS.coachingSoft}>Pro Bono</PillButton>
        </div>
        <textarea value={transcript} onChange={e => setTranscript(e.target.value)} placeholder="语音转写…" rows={4}
          className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
        {paymentType === "paid" && (
          <textarea value={clientSummary} onChange={e => setClientSummary(e.target.value)} placeholder="发给客户的总结（可选）" rows={3}
            className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
        )}
        <PrimaryButton onClick={addSession} color={COLORS.coaching} icon={IconPlus}>归档</PrimaryButton>
      </div>
      {error && <div className="wb-body text-sm mb-3" style={{ color: COLORS.daily }}>{error}</div>}
      <SectionLabel color={COLORS.coaching}>会谈记录（{filteredSessions.length}）</SectionLabel>
      <div className="flex items-center gap-2 flex-wrap mb-3">
        {["全部", "付费", "Pro Bono"].map(f => <PillButton key={f} active={filter === f} onClick={() => setFilter(f)} color={COLORS.coaching} soft={COLORS.coachingSoft}>{f}</PillButton>)}
      </div>
      {filteredSessions.length === 0 ? <EmptyState text="没有符合条件的记录" /> : (
        <div className="space-y-3 mb-8">
          {filteredSessions.map(s => (
            <div key={s.id} className="rounded-sm border p-3" style={{ borderColor: COLORS.line }}>
              {editingId === s.id ? (
                <div className="space-y-2">
                  <div className="flex gap-2">
                    <input value={editDraft.client} onChange={e => setEditDraft({ ...editDraft, client: e.target.value })}
                      className="wb-body flex-1 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                    <input type="date" value={editDraft.date} onChange={e => setEditDraft({ ...editDraft, date: e.target.value })}
                      className="wb-mono px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  </div>
                  <div className="flex gap-2 items-center flex-wrap">
                    <input type="number" step="0.5" min="0" value={editDraft.hours} onChange={e => setEditDraft({ ...editDraft, hours: e.target.value })}
                      className="wb-mono w-24 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                    <span className="wb-mono text-xs" style={{ color: COLORS.inkSoft }}>小时</span>
                    <div className="flex-1" />
                    <PillButton active={editDraft.paymentType === "paid"} onClick={() => setEditDraft({ ...editDraft, paymentType: "paid" })} color={COLORS.coaching} soft={COLORS.coachingSoft}>付费</PillButton>
                    <PillButton active={editDraft.paymentType === "pro_bono"} onClick={() => setEditDraft({ ...editDraft, paymentType: "pro_bono" })} color={COLORS.coaching} soft={COLORS.coachingSoft}>Pro Bono</PillButton>
                  </div>
                  <textarea value={editDraft.transcript} onChange={e => setEditDraft({ ...editDraft, transcript: e.target.value })} rows={4}
                    className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  {editDraft.paymentType === "paid" && (
                    <textarea value={editDraft.clientSummary} onChange={e => setEditDraft({ ...editDraft, clientSummary: e.target.value })} rows={3} placeholder="发给客户的总结"
                      className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  )}
                  <div className="flex gap-2">
                    <PrimaryButton onClick={saveEdit} color={COLORS.coaching}>保存</PrimaryButton>
                    <button onClick={() => { setEditingId(null); setEditDraft(null); }} className="wb-mono text-xs px-3" style={{ color: COLORS.inkSoft }}>取消</button>
                  </div>
                </div>
              ) : (
                <>
                  <div className="flex items-start justify-between gap-2">
                    <div>
                      <div className="wb-display text-base" style={{ color: COLORS.ink }}>{s.client}</div>
                      <div className="wb-mono text-xs mt-0.5" style={{ color: COLORS.inkSoft }}>{fmtDate(s.date)} · {s.hours}h · {s.paymentType === "paid" ? "付费" : "Pro Bono"}</div>
                    </div>
                    <div className="flex items-center gap-2 shrink-0">
                      {!s.summary && <PrimaryButton onClick={() => summarize(s)} disabled={busyId === s.id} color={COLORS.coaching}>AI 总结</PrimaryButton>}
                      <button onClick={() => startEdit(s)} className="wb-mono text-xs px-2 py-1" style={{ color: COLORS.inkSoft }}>更改</button>
                      <button onClick={() => remove(s.id)} className="p-1.5 opacity-60 hover:opacity-100"><IconTrash size={15} color={COLORS.inkSoft} /></button>
                      <button onClick={() => setExpanded(e => ({ ...e, [s.id]: !e[s.id] }))} className="wb-mono text-xs px-2 py-1" style={{ color: COLORS.inkSoft }}>{expanded[s.id] ? "收起" : "展开"}</button>
                    </div>
                  </div>
                  {expanded[s.id] && (
                    <div className="mt-3 space-y-3">
                      {s.summary && (
                        <div>
                          <div className="wb-mono text-xs mb-1" style={{ color: COLORS.inkSoft }}>AI 督导总结</div>
                          <div className="wb-body text-sm whitespace-pre-wrap rounded-sm p-3" style={{ backgroundColor: COLORS.coachingSoft, color: COLORS.ink }}>{s.summary}</div>
                        </div>
                      )}
                      {s.clientSummary && (
                        <div>
                          <div className="wb-mono text-xs mb-1" style={{ color: COLORS.inkSoft }}>发给客户的总结</div>
                          <div className="wb-body text-sm whitespace-pre-wrap rounded-sm p-3" style={{ backgroundColor: COLORS.paperDeep, color: COLORS.ink }}>{s.clientSummary}</div>
                        </div>
                      )}
                      <details><summary className="wb-mono text-xs cursor-pointer" style={{ color: COLORS.inkSoft }}>语音转写</summary>
                        <div className="wb-body text-sm mt-2 whitespace-pre-wrap" style={{ color: COLORS.inkSoft }}>{s.transcript}</div></details>
                    </div>
                  )}
                </>
              )}
            </div>
          ))}
        </div>
      )}
      <SectionLabel color={COLORS.coaching}>整体成长脉络</SectionLabel>
      <div className="mb-6">
        <PrimaryButton onClick={generateOverview} disabled={busyOverview || data.sessions.length === 0} color={COLORS.coaching} icon={IconSparkles}>AI 总结全部会谈</PrimaryButton>
        {data.coachingOverview && <div className="wb-body text-sm whitespace-pre-wrap rounded-sm p-3 mt-3" style={{ backgroundColor: COLORS.coachingSoft, color: COLORS.ink }}>{data.coachingOverview.text}</div>}
      </div>
      <SectionLabel color={COLORS.coaching}>累计概览</SectionLabel>
      <div className="wb-mono text-xs mb-3" style={{ color: COLORS.inkSoft }}>只计入 {ACC_CUTOFF} 及以后的会谈</div>
      <div className="grid grid-cols-2 gap-3 mb-3">
        <div className="rounded-sm border p-4" style={{ borderColor: COLORS.line }}><div className="wb-display text-3xl" style={{ color: COLORS.coaching }}>{countedSessions.length}</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>累计场次</div></div>
        <div className="rounded-sm border p-4" style={{ borderColor: COLORS.line }}><div className="wb-display text-3xl" style={{ color: COLORS.coaching }}>{totalHours}</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>累计小时</div></div>
        <div className="rounded-sm border p-4" style={{ borderColor: COLORS.line }}><div className="wb-display text-3xl" style={{ color: COLORS.coaching }}>{paidHours}</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>付费小时</div></div>
        <div className="rounded-sm border p-4" style={{ borderColor: COLORS.line }}><div className="wb-display text-3xl" style={{ color: COLORS.coaching }}>{proBonoHours}</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>Pro Bono 小时</div></div>
      </div>
      <div className="rounded-sm border p-4" style={{ borderColor: COLORS.line, backgroundColor: COLORS.coachingSoft }}>
        <div className="wb-body text-sm" style={{ color: COLORS.ink }}>ACC 认证进度：已计入 <b>{countableTotal}</b> / 100 小时（付费 {paidHours}/75，Pro Bono {countedProBono}/25 封顶）</div>
        <div className="wb-body text-sm mt-1" style={{ color: COLORS.ink }}>距离 100 小时还差 <b>{hoursToGo}</b> 小时{paidGap > 0 ? `（其中付费小时还差 ${paidGap} 小时）` : ""}</div>
      </div>
    </div>
  );
}

function ContentTab({ data, mutate }) {
  const [subTab, setSubTab] = useState(CONTENT_TAGS[0]);
  const [title, setTitle] = useState(""); const [content, setContent] = useState(""); const [appendix, setAppendix] = useState("");
  const [editingId, setEditingId] = useState(null); const [editDraft, setEditDraft] = useState(null);
  const add = () => {
    if (!title.trim() || subTab === "所有") return;
    mutate(d => ({ ...d, ideas: [{ id: uid(), tag: subTab, title: title.trim(), content: content.trim(), appendix: appendix.trim(), createdAt: Date.now() }, ...d.ideas] }));
    setTitle(""); setContent(""); setAppendix("");
  };
  const remove = (id) => mutate(d => ({ ...d, ideas: d.ideas.filter(i => i.id !== id) }));
  const startEdit = (i) => { setEditingId(i.id); setEditDraft({ ...i }); };
  const saveEdit = () => { mutate(d => ({ ...d, ideas: d.ideas.map(i => i.id === editDraft.id ? editDraft : i) })); setEditingId(null); setEditDraft(null); };
  const filtered = subTab === "所有" ? data.ideas : data.ideas.filter(i => i.tag === subTab);
  return (
    <div>
      <div className="flex items-center gap-2 flex-wrap mb-6">
        {[...CONTENT_TAGS, "所有"].map(t => <PillButton key={t} active={subTab === t} onClick={() => setSubTab(t)} color={COLORS.content} soft={COLORS.contentSoft}>{t}</PillButton>)}
      </div>
      {subTab === "所有" ? (
        <div className="wb-body text-xs mb-6 rounded-sm border border-dashed p-3" style={{ color: COLORS.inkSoft, borderColor: COLORS.line }}>"所有"只用来浏览 — 切换到具体分类才能记新想法</div>
      ) : (
        <div className="space-y-2 mb-6">
          <SectionLabel color={COLORS.content}>记一个{subTab}想法</SectionLabel>
          <input value={title} onChange={e => setTitle(e.target.value)} placeholder="标题"
            className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
          <textarea value={content} onChange={e => setContent(e.target.value)} placeholder="内容（可选）" rows={3}
            className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
          <textarea value={appendix} onChange={e => setAppendix(e.target.value)} placeholder="附注 / appendix（可选）" rows={2}
            className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
          <PrimaryButton onClick={add} color={COLORS.content} icon={IconPlus}>记下来</PrimaryButton>
        </div>
      )}
      <SectionLabel color={COLORS.content}>{subTab}（{filtered.length}）</SectionLabel>
      {filtered.length === 0 ? <EmptyState text="这里还没有想法" /> : (
        <div className="space-y-2">
          {filtered.map(i => (
            <div key={i.id} className="rounded-sm border p-3" style={{ borderColor: COLORS.line }}>
              {editingId === i.id ? (
                <div className="space-y-2">
                  <input value={editDraft.title} onChange={e => setEditDraft({ ...editDraft, title: e.target.value })}
                    className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  <textarea value={editDraft.content} onChange={e => setEditDraft({ ...editDraft, content: e.target.value })} rows={3}
                    className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  <textarea value={editDraft.appendix} onChange={e => setEditDraft({ ...editDraft, appendix: e.target.value })} rows={2}
                    className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none resize-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
                  <div className="flex gap-2">
                    <PrimaryButton onClick={saveEdit} color={COLORS.content}>保存</PrimaryButton>
                    <button onClick={() => { setEditingId(null); setEditDraft(null); }} className="wb-mono text-xs px-3" style={{ color: COLORS.inkSoft }}>取消</button>
                  </div>
                </div>
              ) : (
                <div className="flex items-start justify-between gap-2">
                  <div className="flex-1">
                    <div className="flex items-center gap-2">
                      <span className="wb-mono text-xs px-2 py-0.5 rounded-full" style={{ backgroundColor: COLORS.contentSoft, color: COLORS.content }}>{i.tag}</span>
                      <div className="wb-display text-base" style={{ color: COLORS.ink }}>{i.title}</div>
                    </div>
                    {i.content && <div className="wb-body text-sm mt-1" style={{ color: COLORS.ink }}>{i.content}</div>}
                    {i.appendix && <div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>{i.appendix}</div>}
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => startEdit(i)} className="wb-mono text-xs px-2 py-1" style={{ color: COLORS.inkSoft }}>更改</button>
                    <button onClick={() => remove(i.id)} className="p-1 opacity-60 hover:opacity-100"><IconTrash size={14} color={COLORS.inkSoft} /></button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function TodoTab({ data, mutate }) {
  const [text, setText] = useState("");
  const [editingId, setEditingId] = useState(null); const [editText, setEditText] = useState("");
  const add = () => { if (!text.trim()) return; mutate(d => ({ ...d, todoEntries: [{ id: uid(), text: text.trim(), createdAt: Date.now(), done: false }, ...d.todoEntries] })); setText(""); };
  const onKeyDown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } };
  const remove = (id) => mutate(d => ({ ...d, todoEntries: d.todoEntries.filter(b => b.id !== id) }));
  const toggleDone = (id) => mutate(d => ({ ...d, todoEntries: d.todoEntries.map(b => b.id === id ? { ...b, done: !b.done } : b) }));
  const startEdit = (b) => { setEditingId(b.id); setEditText(b.text); };
  const saveEdit = (id) => { mutate(d => ({ ...d, todoEntries: d.todoEntries.map(b => b.id === id ? { ...b, text: editText.trim() || b.text } : b) })); setEditingId(null); setEditText(""); };
  return (
    <div>
      <SectionLabel color={COLORS.daily}>记一条待办</SectionLabel>
      <div className="mb-6">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={onKeyDown} placeholder="要做的事情… 敲回车"
          className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
      </div>
      <SectionLabel color={COLORS.daily}>记录（{data.todoEntries.length}）</SectionLabel>
      {data.todoEntries.length === 0 ? <EmptyState text="还是空的 — 上面敲一条试试" /> : (
        <div className="space-y-2">
          {data.todoEntries.map(b => (
            <div key={b.id} className="rounded-sm border p-3" style={{ borderColor: COLORS.line }}>
              {editingId === b.id ? (
                <div className="flex gap-2">
                  <input value={editText} onChange={e => setEditText(e.target.value)} onKeyDown={e => { if (e.key === "Enter") saveEdit(b.id); }}
                    className="wb-body flex-1 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} autoFocus />
                  <PrimaryButton onClick={() => saveEdit(b.id)} color={COLORS.daily}>保存</PrimaryButton>
                </div>
              ) : (
                <div className="flex items-start gap-2">
                  <div className="flex-1">
                    <div className="wb-body text-sm" style={{ color: b.done ? COLORS.inkSoft : COLORS.ink, textDecoration: b.done ? "line-through" : "none" }}>{b.text}</div>
                    <div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>{fmtTime(b.createdAt)}</div>
                  </div>
                  <div className="flex items-center gap-1 shrink-0">
                    <button onClick={() => startEdit(b)} className="wb-mono text-xs px-2 py-1" style={{ color: COLORS.inkSoft }}>更改</button>
                    <button onClick={() => toggleDone(b.id)} className="wb-mono text-xs px-2 py-1" style={{ color: b.done ? COLORS.coaching : COLORS.inkSoft }}>{b.done ? "已完成" : "完成"}</button>
                    <button onClick={() => remove(b.id)} className="p-1.5 opacity-60 hover:opacity-100"><IconTrash size={14} color={COLORS.inkSoft} /></button>
                  </div>
                </div>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function PandoraTab({ data, mutate, apiKey }) {
  const [text, setText] = useState("");
  const [busy, setBusy] = useState(false); const [error, setError] = useState("");
  const add = () => { if (!text.trim()) return; mutate(d => ({ ...d, pandoraEntries: [{ id: uid(), text: text.trim(), createdAt: Date.now() }, ...d.pandoraEntries] })); setText(""); };
  const onKeyDown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); add(); } };
  const remove = (id) => mutate(d => ({ ...d, pandoraEntries: d.pandoraEntries.filter(b => b.id !== id) }));
  const reflect = async () => {
    setError(""); setBusy(true);
    try {
      const list = data.pandoraEntries.map(b => `- ${b.text}`).join("\n") || "（暂无记录）";
      const result = await callClaude(
        "你是一个善于从零碎念头里发现有趣东西的伙伴。请始终用中文回复，语气轻松、有洞察，不要写成待办清单。",
        `这是我随手记下的一堆天马行空的念头：\n\n${list}\n\n不用整理成待办事项。请聊一聊：\n1. 这些念头里有意思的部分是什么\n2. 从中能看出我身上什么样的特质，未来可以往哪个方向延展\n3. 顺带丢给我一些不一定有用但挺有意思的知识拓展`,
        apiKey, 1500
      );
      mutate(d => ({ ...d, boxReflection: { text: result, generatedAt: Date.now() } }));
    } catch (e) { setError(e.message); } finally { setBusy(false); }
  };
  return (
    <div>
      <SectionLabel color={COLORS.progress}>扔进来</SectionLabel>
      <div className="mb-6">
        <input value={text} onChange={e => setText(e.target.value)} onKeyDown={onKeyDown} placeholder="天马行空的想象力，什么都行… 敲回车"
          className="wb-body w-full px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
      </div>
      <SectionLabel color={COLORS.progress}>记录（{data.pandoraEntries.length}）</SectionLabel>
      {data.pandoraEntries.length === 0 ? <EmptyState text="还是空的 — 上面敲一条试试" /> : (
        <div className="space-y-2 mb-6">
          {data.pandoraEntries.map(b => (
            <div key={b.id} className="flex items-start gap-2 rounded-sm border p-3" style={{ borderColor: COLORS.line }}>
              <div className="flex-1"><div className="wb-body text-sm" style={{ color: COLORS.ink }}>{b.text}</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>{fmtTime(b.createdAt)}</div></div>
              <button onClick={() => remove(b.id)} className="p-1 opacity-60 hover:opacity-100 shrink-0"><IconTrash size={14} color={COLORS.inkSoft} /></button>
            </div>
          ))}
        </div>
      )}
      <SectionLabel color={COLORS.progress}>整理脑洞</SectionLabel>
      <div className="mb-6">
        <PrimaryButton onClick={reflect} disabled={busy || data.pandoraEntries.length === 0} color={COLORS.progress} icon={IconWand}>整理脑洞</PrimaryButton>
        {error && <div className="wb-body text-sm mt-3" style={{ color: COLORS.daily }}>{error}</div>}
        {data.boxReflection && <div className="wb-body text-sm whitespace-pre-wrap rounded-sm p-3 mt-3" style={{ backgroundColor: COLORS.progressSoft, color: COLORS.ink }}>{data.boxReflection.text}</div>}
      </div>
    </div>
  );
}

function SettingsPanel({ apiKey, setApiKey, onClose }) {
  const [val, setVal] = useState(apiKey || "");
  return (
    <div className="rounded-sm border p-4 mb-6" style={{ borderColor: COLORS.line, backgroundColor: "#fff" }}>
      <div className="wb-mono text-xs mb-2" style={{ color: COLORS.inkSoft }}>ANTHROPIC API KEY（仅保存在你本机浏览器，不会上传）</div>
      <div className="flex gap-2">
        <input type="password" value={val} onChange={e => setVal(e.target.value)} placeholder="sk-ant-..."
          className="wb-mono flex-1 px-3 py-2 text-sm rounded-sm border bg-transparent outline-none" style={{ borderColor: COLORS.line, color: COLORS.ink }} />
        <button onClick={() => { setApiKey(val); localStorage.setItem(API_KEY_STORAGE, val); onClose(); }}
          className="wb-body px-4 py-2 text-sm rounded-sm" style={{ backgroundColor: COLORS.ink, color: COLORS.paper }}>保存</button>
      </div>
      <div className="wb-body text-xs mt-2" style={{ color: COLORS.inkSoft }}>不填也能用归档/记录功能，只是"AI 总结/生成"这几个按钮需要它。</div>
    </div>
  );
}

function App() {
  const [active, setActive] = useState("coaching");
  const [data, setData] = useState(emptyData());
  const [apiKey, setApiKey] = useState("");
  const [showSettings, setShowSettings] = useState(false);
  useEffect(() => { setData(loadData()); setApiKey(localStorage.getItem(API_KEY_STORAGE) || ""); }, []);
  const mutate = useCallback((updater) => { setData(prev => { const next = updater(prev); saveData(next); return next; }); }, []);
  return (
    <div className="min-h-screen wb-body" style={{ backgroundColor: COLORS.paper }}>
      <div className="max-w-3xl mx-auto px-4 py-6">
        <header className="mb-6 flex items-start justify-between">
          <div><div className="wb-display text-2xl" style={{ color: COLORS.ink }}>执业工作台</div><div className="wb-mono text-xs mt-1" style={{ color: COLORS.inkSoft }}>coaching · content · todo · pandora</div></div>
          <button onClick={() => setShowSettings(s => !s)} className="p-2"><IconGear size={18} color={COLORS.inkSoft} /></button>
        </header>
        {showSettings && <SettingsPanel apiKey={apiKey} setApiKey={setApiKey} onClose={() => setShowSettings(false)} />}
        <nav className="flex gap-1 mb-6 border-b" style={{ borderColor: COLORS.line }}>
          {TABS.map(t => {
            const Ico = t.icon; const isActive = t.key === active;
            return (
              <button key={t.key} onClick={() => setActive(t.key)} className="wb-body flex-1 flex flex-col items-center gap-1 pb-2 pt-1 text-xs relative" style={{ color: isActive ? t.color : COLORS.inkSoft }}>
                <Ico size={17} /><span>{t.label}</span>
                {isActive && <span className="absolute -bottom-px left-0 right-0 h-0.5" style={{ backgroundColor: t.color }} />}
              </button>
            );
          })}
        </nav>
        <main>
          {active === "coaching" && <CoachingTab data={data} mutate={mutate} apiKey={apiKey} />}
          {active === "content" && <ContentTab data={data} mutate={mutate} />}
          {active === "box" && <TodoTab data={data} mutate={mutate} />}
          {active === "guide" && <PandoraTab data={data} mutate={mutate} apiKey={apiKey} />}
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
